<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMEN · Page introuvable</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#100b29">
<meta http-equiv="refresh" content="8; url=/">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preload" href="/fonts/unbounded-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Servie par GitHub Pages pour toute adresse inconnue : chemins absolus obligatoires. */
  @font-face { font-family: 'Unbounded'; font-weight: 900; font-display: swap; src: url('/fonts/unbounded-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400; font-display: swap; src: url('/fonts/instrument-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 600; font-display: swap; src: url('/fonts/instrument-sans-latin-600-normal.woff2') format('woff2'); }
  :root { --nuit: #100b29; --haut: #1f1550; --bas: #2b1a5e; --lin: #f1ecff; --brume: #a19bc9; --ambre: #ffb627; --cyan: #2cc9f0; color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; text-align: center; color: var(--lin); font: 17px/1.55 'Instrument Sans', system-ui, sans-serif;
    background: radial-gradient(120% 60% at 50% 110%, var(--bas) 0%, transparent 60%), radial-gradient(90% 50% at 50% -10%, var(--haut) 0%, transparent 70%), var(--nuit); }
  main { padding: 24px 16px; max-width: 420px; }
  .orbe { width: 92px; height: 92px; margin: 0 auto 26px; border-radius: 50%; opacity: .55;
    background: radial-gradient(circle at 35% 30%, #fff8e0 0 8%, #ffd36b 22%, #ff9d2f 55%, #8a3b12 100%);
    box-shadow: 0 0 0 10px rgba(255, 255, 255, .05), 0 0 50px rgba(255, 182, 39, .25); filter: grayscale(.6); }
  h1 { font: 900 clamp(34px, 10vw, 48px)/1 'Unbounded', 'Trebuchet MS', sans-serif; margin: 0 0 14px; }
  p { margin: 0 0 8px; color: var(--brume); }
  a.btn { display: inline-block; margin-top: 22px; padding: 15px 28px; border-radius: 999px; background: var(--ambre); color: #22140a;
    font-weight: 600; text-decoration: none; box-shadow: 0 10px 30px -10px rgba(255, 182, 39, .6); }
  a.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .auto { margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="orbe" aria-hidden="true"></div>
  <h1>Orbe éteinte</h1>
  <p>Cette page n'existe pas (ou plus).</p>
  <a class="btn" href="/">Retour au jeu</a>
  <p class="auto">Retour automatique dans quelques secondes.</p>
</main>
</body>
</html>
